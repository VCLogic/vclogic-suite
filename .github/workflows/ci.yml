name: Suite contracts and offline integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.17'
          python-version: '3.12.12'
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked vclogic bootstrap --profile core
      - run: uv run --locked pytest
        env:
          VCLOGIC_INTEGRATION: '1'
      - run: docker compose config --quiet
      - run: docker compose up --build --abort-on-container-exit --exit-code-from core
