[project]
name = "vclogic-suite"
version = "0.1.0"
description = "Pinned, reviewer-friendly orchestration for the VCLogic research ecosystem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv==1.2.3",
]

[project.scripts]
vclogic = "vclogic_suite.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs installed pinned component CLIs (VCLOGIC_INTEGRATION=1)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
